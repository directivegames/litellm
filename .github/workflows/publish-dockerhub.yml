# Publish the primary proxy image to Docker Hub as directivegames/litellm.
# Dispatch "Publish Docker Hub". The image tag is <project.version>-dg.<counter>.
# The counter is the next number for that version already on Docker Hub.
# A new project.version starts again at 1. git_ref selects the commit to build.
# amd64 and arm64 each build on a runner of that architecture, then both are published under one tag.
# Secrets on directivegames/litellm: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN.

name: Publish Docker Hub

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to build. Empty uses the branch this workflow runs on.
        required: false
        type: string
        default: ""
      dry_run:
        description: Build only; skip push
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # Digest files passed from the build jobs to the publish job.
  actions: write

concurrency:
  group: publish-dockerhub
  cancel-in-progress: false

env:
  IMAGE: directivegames/litellm

jobs:
  prepare:
    name: Choose image tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full_sha: ${{ steps.meta.outputs.full_sha }}
      sha: ${{ steps.meta.outputs.sha }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      push: ${{ steps.meta.outputs.push }}
    steps:
      - name: Confirm repository
        if: github.repository != 'directivegames/litellm'
        run: |
          echo "::error::This workflow only pushes directivegames/litellm from directivegames/litellm"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref != '' && github.event.inputs.git_ref || github.ref }}
          fetch-depth: 1

      - name: Image tags
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          image_tag="$(python .github/scripts/next_dockerhub_tag.py)"
          full_sha="$(git rev-parse HEAD)"
          sha="$(git rev-parse --short HEAD)"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            push=false
          else
            push=true
          fi
          {
            echo "full_sha=${full_sha}"
            echo "sha=${sha}"
            echo "image_tag=${image_tag}"
            echo "push=${push}"
          } >> "$GITHUB_OUTPUT"
          echo "Will publish: ${IMAGE}:${image_tag} and ${IMAGE}:${sha} (push=${push})"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # A failed architecture still lets the other one save its layer cache.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          # Native arm64. The gateway deploy pulls this architecture.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.full_sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # A tag is applied only after both architectures exist, so a pull never sees one architecture alone.
          # Dry runs keep the layer cache and do not push.
          outputs: ${{ needs.prepare.outputs.push == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          # Attestations stay off. The publish step tags the image from the two digests and does not carry them.
          provenance: false
          sbom: false
          # One cache per architecture. mode=max keeps the dependency install for the next source change.
          cache-from: type=gha,scope=litellm-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=litellm-${{ matrix.arch }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Build did not return an image digest"
            exit 1
          fi
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish image
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest and push
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHORT_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected 2 image digests, found ${#digests[@]}"
            exit 1
          fi
          args=()
          for digest in "${digests[@]}"; do
            args+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:${SHORT_SHA}" \
            "${args[@]}"

      - name: Inspect image
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
        run: docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"

  report:
    name: Summary
    needs: [prepare, build, merge]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Summary
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
          SHORT_SHA: ${{ needs.prepare.outputs.sha }}
          PUSH: ${{ needs.prepare.outputs.push }}
          BUILD_RESULT: ${{ needs.build.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
        run: |
          set -euo pipefail
          {
            echo "### ${IMAGE}"
            echo ""
            echo "- image tag: \`${IMAGE_TAG}\`"
            echo "- tags: \`${IMAGE}:${IMAGE_TAG},${IMAGE}:${SHORT_SHA}\`"
            echo "- sha: \`${SHORT_SHA}\`"
            echo "- push: \`${PUSH}\`"
            echo "- build: \`${BUILD_RESULT}\`"
            echo "- publish: \`${MERGE_RESULT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "::error::Image build did not succeed"
            exit 1
          fi
          if [ "${PUSH}" = "true" ] && [ "${MERGE_RESULT}" != "success" ]; then
            echo "::error::Manifest publish did not succeed"
            exit 1
          fi
